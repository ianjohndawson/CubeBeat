<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CubeBeat Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #e0e0e0;
            --accent-go: #00ff88;
            --accent-listen: #00a2ff;
            --danger: #ff4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        .flash-go { background-color: #00331b !important; }
        .flash-listen { background-color: #001f33 !important; }

        .container { width: 90%; max-width: 450px; text-align: center; }

        /* Display Area */
        .bpm-display { font-size: 6rem; font-weight: 900; margin: 0; color: white; line-height: 1; }
        .tps-sub { font-size: 1.2rem; color: #888; margin-bottom: 15px; }
        .active-algo-name { font-weight: bold; color: var(--accent-listen); margin-bottom: 20px; font-size: 1.2rem; }

        /* Controls */
        .bpm-stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .step-btn, .tap-btn { background: #2a2a2a; border: 1px solid #444; color: white; padding: 15px 5px; border-radius: 12px; font-weight: bold; }
        .tap-btn { grid-column: span 4; color: var(--accent-listen); margin-top: 5px; }

        .btn-main { width: 100%; background-color: var(--accent-go); color: black; font-size: 1.5rem; border: none; padding: 20px; border-radius: 15px; font-weight: 900; }
        .btn-stop { background-color: var(--danger); color: white; }

        .secondary-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .sec-btn { background: #2a2a2a; border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; font-size: 0.9rem; }

        /* Library Overlay */
        #libraryOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 100; display: none;
            flex-direction: column; padding: 20px; box-sizing: border-box;
        }
        .lib-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .search-box { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: white; margin-bottom: 15px; }
        .lib-list { flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .lib-item { background: #2a2a2a; padding: 15px 5px; border-radius: 8px; text-align: center; font-size: 0.9rem; border: 1px solid #333; }

        /* Overview Section */
        .stats-bar { display: flex; justify-content: space-around; background: #1a1a1a; padding: 10px; border-radius: 10px; margin-top: 20px; font-size: 0.8rem; color: #aaa; }

        button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="container">
    <div id="statusPill" style="display:none; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px;">LISTEN</div>
    <div class="active-algo-name" id="currentAlgoDisplay">Select Algorithm</div>
    <div class="bpm-display" id="bpmDisplay">120</div>
    <div class="tps-sub" id="tpsDisplay">2.00 TPS</div>

    <div class="bpm-stepper">
        <button class="step-btn" onclick="adjustBPM(-5)">-5</button>
        <button class="step-btn" onclick="adjustBPM(-1)">-1</button>
        <button class="step-btn" onclick="adjustBPM(1)">+1</button>
        <button class="step-btn" onclick="adjustBPM(5)">+5</button>
        <button class="tap-btn" id="tapBtn">TAP TEMPO</button>
    </div>

    <button id="startBtn" class="btn-main">START</button>

    <div class="secondary-btns">
        <button class="sec-btn" onclick="toggleLibrary()">📚 LIBRARY</button>
        <button class="sec-btn" onclick="saveMilestone()">⭐ SAVE PB</button>
    </div>

    <div class="stats-bar">
        <span id="sessionCount">Session: 0 saved</span>
        <span id="bestBpm">Best: -- BPM</span>
    </div>
</div>

<div id="libraryOverlay">
    <div class="lib-header">
        <h2>Algorithms</h2>
        <button onclick="toggleLibrary()" style="background:none; border:none; color:var(--danger); font-size:1.5rem;">✕</button>
    </div>
    <input type="text" class="search-box" id="libSearch" placeholder="Search PLL or OLL..." oninput="filterLibrary()">
    <div class="lib-list" id="libList"></div>
</div>

<script>
    let audioCtx = null, nextNoteTime = 0.0, timerID = null, isPlaying = false;
    let currentBeat = 0, currentBar = 0, bpm = 120, currentAlgo = "None";
    let tapTimes = [], sessionSaves = 0;

    const algos = [
        ...['Aa', 'Ab', 'E', 'F', 'Ga', 'Gb', 'Gc', 'Gd', 'H', 'Ja', 'Jb', 'Na', 'Nb', 'Ra', 'Rb', 'T', 'Ua', 'Ub', 'V', 'Y', 'Z'].map(n => 'PLL ' + n),
        ...Array.from({length: 57}, (_, i) => 'OLL ' + (i + 1))
    ];

    function toggleLibrary() {
        const lib = document.getElementById('libraryOverlay');
        lib.style.display = lib.style.display === 'flex' ? 'none' : 'flex';
        if (lib.style.display === 'flex') renderLibrary();
    }

    function renderLibrary() {
        const list = document.getElementById('libList');
        const filter = document.getElementById('libSearch').value.toLowerCase();
        list.innerHTML = algos.filter(a => a.toLowerCase().includes(filter)).map(a => 
            `<div class="lib-item" onclick="selectAlgo('${a}')">${a}</div>`
        ).join('');
    }

    function selectAlgo(name) {
        currentAlgo = name;
        document.getElementById('currentAlgoDisplay').textContent = name;
        toggleLibrary();
    }

    function filterLibrary() { renderLibrary(); }

    function adjustBPM(amount) {
        bpm = Math.max(30, Math.min(500, bpm + amount));
        updateDisplays();
    }

    function updateDisplays() {
        document.getElementById('bpmDisplay').textContent = bpm;
        document.getElementById('tpsDisplay').textContent = (bpm / 60).toFixed(2) + " TPS";
    }

    // Audio & Metronome Logic (Same robust logic as before)
    function scheduleNote(beat, bar, time) {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.frequency.value = (beat === 0) ? 1100 : 700;
        env.gain.setValueAtTime(0.15, time);
        env.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
        osc.connect(env); env.connect(audioCtx.destination);
        osc.start(time); osc.stop(time + 0.1);
        
        const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
        setTimeout(() => {
            document.body.classList.remove('flash-go', 'flash-listen');
            document.body.classList.add(bar === 0 ? 'flash-listen' : 'flash-go');
            const pill = document.getElementById('statusPill');
            pill.style.display = 'inline-block';
            pill.textContent = bar === 0 ? 'LISTEN' : 'GO!';
            pill.style.backgroundColor = bar === 0 ? 'var(--accent-listen)' : 'var(--accent-go)';
        }, delay);
    }

    function scheduler() {
        while (nextNoteTime < audioCtx.currentTime + 0.1) {
            scheduleNote(currentBeat, currentBar, nextNoteTime);
            nextNoteTime += (60.0 / bpm);
            currentBeat = (currentBeat + 1) % 4;
            if (currentBeat === 0) currentBar = (currentBar === 0) ? 1 : 0;
        }
        timerID = setTimeout(scheduler, 25.0);
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
        if (!audioCtx) audioCtx = new AudioContext();
        if (isPlaying) {
            clearTimeout(timerID);
            isPlaying = false;
            document.getElementById('startBtn').textContent = "START";
            document.getElementById('startBtn').classList.remove('btn-stop');
        } else {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            nextNoteTime = audioCtx.currentTime + 0.05;
            currentBeat = 0; currentBar = 0;
            scheduler();
            isPlaying = true;
            document.getElementById('startBtn').textContent = "STOP";
            document.getElementById('startBtn').classList.add('btn-stop');
        }
    });

    function saveMilestone() {
        sessionSaves++;
        document.getElementById('sessionCount').textContent = `Session: ${sessionSaves} saved`;
        // Alert feedback
        const btn = document.querySelector('.sec-btn:last-child');
        btn.textContent = "SAVED! ✓";
        setTimeout(() => btn.textContent = "⭐ SAVE PB", 1000);
    }

    document.getElementById('tapBtn').addEventListener('click', () => {
        const now = performance.now();
        tapTimes.push(now);
        if (tapTimes.length > 4) tapTimes.shift();
        if (tapTimes.length > 1) {
            const avg = (tapTimes[tapTimes.length-1] - tapTimes[0]) / (tapTimes.length - 1);
            bpm = Math.round(60000 / avg);
            updateDisplays();
        }
    });

    updateDisplays();
</script>

</body>
</html>
