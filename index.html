<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CubeBeat</title>
    
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #e0e0e0;
            --accent-go: #00ff88;
            --danger: #ff4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            transition: background-color 0.05s;
        }

        .flash-strong { background-color: #004425 !important; }
        .flash-weak { background-color: #252525 !important; }

        .container { width: 90%; max-width: 450px; text-align: center; z-index: 10; display: flex; flex-direction: column; height: 92vh; justify-content: space-between; }

        .metronome-box { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .bpm-display { font-size: 8rem; font-weight: 900; margin: 0; color: white; line-height: 1; }
        .tps-sub { font-size: 1.4rem; color: #888; margin-bottom: 30px; }

        .bpm-stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }
        .step-btn { background: #2a2a2a; border: 1px solid #444; color: white; padding: 22px 5px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; }

        .btn-main { width: 100%; background-color: var(--accent-go); color: black; font-size: 2rem; border: none; padding: 25px; border-radius: 20px; font-weight: 900; }
        .btn-stop { background-color: var(--danger); color: white; }

        .dashboard-footer { border-top: 1px solid #333; padding-top: 15px; margin-top: 10px; padding-bottom: 10px; }
        .monitor-line { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 0.95rem; }
        .monitor-label { color: #888; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .monitor-focus { color: var(--accent-go); font-weight: 800; font-size: 1rem; }
        .monitor-count { color: #666; font-family: monospace; font-size: 0.85rem; }

        .secondary-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        .sec-btn { background: #2a2a2a; border: 1px solid #444; color: white; padding: 12px 5px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .active-toggle { border-color: var(--accent-go); color: var(--accent-go); background: #15251c; }

        #libraryOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 100; display: none;
            flex-direction: column; padding: 25px; box-sizing: border-box;
        }
        .lib-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        select { flex-grow: 1; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 10px; padding: 12px; font-size: 1.1rem; appearance: none; }
        
        .lib-list { flex-grow: 1; overflow-y: auto; }
        .lib-divider { padding: 20px 5px 8px; font-size: 0.8rem; color: var(--accent-go); font-weight: 900; text-transform: uppercase; border-bottom: 1px solid #333; }
        .lib-item { background: #1e1e1e; padding: 18px; border-radius: 12px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .lib-item.practised { border-color: var(--accent-go); background: #15251c; }
        
        .tick-box { width: 30px; height: 30px; border: 2px solid #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--accent-go); font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="metronome-box">
        <div class="bpm-display" id="bpmDisplay">30</div>
        <div class="tps-sub" id="tpsDisplay">0.50 TPS</div>

        <div class="bpm-stepper">
            <button class="step-btn" onclick="adjustBPM(-5)">-5</button>
            <button class="step-btn" onclick="adjustBPM(-1)">-1</button>
            <button class="step-btn" onclick="adjustBPM(1)">+1</button>
            <button class="step-btn" onclick="adjustBPM(5)">+5</button>
        </div>

        <button id="startBtn" class="btn-main">START</button>
    </div>

    <div class="dashboard-footer">
        <div class="monitor-line">
            <span class="monitor-label">OLL Focus</span>
            <span class="monitor-focus" id="ollFocus">Ready</span>
            <span class="monitor-count" id="ollProgress">0 / 57</span>
        </div>
        <div class="monitor-line">
            <span class="monitor-label">PLL Focus</span>
            <span class="monitor-focus" id="pllFocus">Ready</span>
            <span class="monitor-count" id="pllProgress">0 / 21</span>
        </div>
        
        <div class="secondary-btns">
            <button class="sec-btn" onclick="toggleLibrary()">📚 Library</button>
            <button id="flashToggle" class="sec-btn active-toggle" onclick="toggleFlash()">✨ Flash</button>
            <button id="rampToggle" class="sec-btn" onclick="toggleRamp()">📈 Ramp</button>
        </div>
    </div>
</div>

<div id="libraryOverlay">
    <div class="lib-nav">
        <select id="libFilter" onchange="renderLibrary()">
            <option value="ALL">Show All</option>
            <option value="OLL">OLL Only</option>
            <option value="PLL">PLL Only</option>
        </select>
        <button class="sec-btn" style="border-color: var(--danger); width: 60px;" onclick="toggleLibrary()">✕</button>
    </div>
    <div class="lib-list" id="libList"></div>
</div>

<script>
    let audioCtx = null, nextNoteTime = 0.0, timerID = null, isPlaying = false;
    let currentBeat = 0, bpm = 30, visualFlash = true, rampActive = false;
    let practised = JSON.parse(localStorage.getItem('cubePractised')) || [];

    const pllAlgos = [{ n: 'Aa', g: 'Adj' }, { n: 'Ab', g: 'Adj' }, { n: 'E', g: 'Corn' }, { n: 'F', g: 'Adj' }, { n: 'Ga', g: 'G' }, { n: 'Gb', g: 'G' }, { n: 'Gc', g: 'G' }, { n: 'Gd', g: 'G' }, { n: 'H', g: 'Edge' }, { n: 'Ja', g: 'Adj' }, { n: 'Jb', g: 'Adj' }, { n: 'Na', g: 'Adj' }, { n: 'Nb', g: 'Adj' }, { n: 'Ra', g: 'Adj' }, { n: 'Rb', g: 'Adj' }, { n: 'T', g: 'Adj' }, { n: 'Ua', g: 'Edge' }, { n: 'Ub', g: 'Edge' }, { n: 'V', g: 'Adj' }, { n: 'Y', g: 'Adj' }, { n: 'Z', g: 'Edge' }];
    const ollSet = ["T", "P", "Breakneck", "Seein' Headlights", "Key", "Ant", "Mounted Fish", "Big Lightning", "Sune", "Anti-Sune", "Cross", "Chameleon", "Bowtie", "Bruno", "Headlights", "Arrow", "H", "Lightning", "Downstairs", "Couch", "Upstairs", "Poodle", "WTF", "Anti-Poodle", "Anti-WTF", "Blank", "Slash", "Bunny", "Anti-Nazi", "Zamboni", "Crown", "X", "Fish Salad", "Frying Pan", "Front Squeezy", "Kite", "Anti-Kite", "Anti-Breakneck", "Anti-Frying Pan", "Back Squeezy", "Mario", "Wario", "Rice Cooker", "Streetlights", "Squeegee", "Gun", "Highway", "Anti-Squeegee", "Anti-Gun", "Righty-Square", "Lefty-Square", "Lefty Big Lightning", "Inverse P", "Anti-Couch", "City", "Poodle", "Slash"];

    function togglePractised(name, event) {
        event.stopPropagation();
        practised = practised.includes(name) ? practised.filter(a => a !== name) : [...practised, name];
        localStorage.setItem('cubePractised', JSON.stringify(practised));
        renderLibrary();
        updateTally();
    }

    function selectAlgo(name) {
        const [type, ...rest] = name.split(' ');
        const cleanName = rest.join(' ');
        document.getElementById(type.toLowerCase() + 'Focus').textContent = cleanName;
        toggleLibrary();
    }

    function updateTally() {
        const ollCount = practised.filter(p => p.startsWith('OLL')).length;
        const pllCount = practised.filter(p => p.startsWith('PLL')).length;
        document.getElementById('ollProgress').textContent = `${ollCount} / 57`;
        document.getElementById('pllProgress').textContent = `${pllCount} / 21`;
    }

    function renderLibrary() {
        const filter = document.getElementById('libFilter').value;
        const list = document.getElementById('libList');
        let html = '';

        if (filter === 'ALL' || filter === 'PLL') {
            html += '<div class="lib-divider">PLL Cases</div>';
            pllAlgos.forEach(a => {
                const id = 'PLL ' + a.n;
                const isDone = practised.includes(id);
                html += `<div class="lib-item ${isDone ? 'practised' : ''}" onclick="selectAlgo('${id}')">
                    <div><strong>${a.n}</strong> <small>${a.g}</small></div>
                    <div class="tick-box" onclick="togglePractised('${id}', event)">${isDone ? '✓' : ''}</div>
                </div>`;
            });
        }

        if (filter === 'ALL' || filter === 'OLL') {
            html += '<div class="lib-divider">OLL Cases</div>';
            [...new Set(ollSet)].forEach(name => {
                const id = 'OLL ' + name;
                const isDone = practised.includes(id);
                html += `<div class="lib-item ${isDone ? 'practised' : ''}" onclick="selectAlgo('${id}')">
                    <div><strong>${name}</strong></div>
                    <div class="tick-box" onclick="togglePractised('${id}', event)">${isDone ? '✓' : ''}</div>
                </div>`;
            });
        }
        list.innerHTML = html;
    }

    function scheduleNote(beat, time) {
        if (audioCtx) {
            const osc = audioCtx.createOscillator();
            const env = audioCtx.createGain();
            osc.frequency.value = (beat === 0) ? 1000 : 600;
            env.gain.setValueAtTime(0.1, time);
            env.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
            osc.connect(env); env.connect(audioCtx.destination);
            osc.start(time); osc.stop(time + 0.1);
        }
        if (visualFlash) {
            const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
            setTimeout(() => {
                const flashClass = (beat === 0) ? 'flash-strong' : 'flash-weak';
                document.body.classList.add(flashClass);
                setTimeout(() => document.body.classList.remove(flashClass), 100);
            }, delay);
        }
    }

    function scheduler() {
        while (nextNoteTime < audioCtx.currentTime + 0.1) {
            scheduleNote(currentBeat, nextNoteTime);
            nextNoteTime += (60.0 / bpm);
            currentBeat = (currentBeat + 1) % 4;
            // Ramp Logic: Every 4 beats, increment BPM
            if (currentBeat === 0 && rampActive) {
                adjustBPM(1);
            }
        }
        timerID = setTimeout(scheduler, 25.0);
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        if (isPlaying) {
            clearTimeout(timerID); isPlaying = false;
            document.getElementById('startBtn').textContent = "START";
            document.getElementById('startBtn').classList.remove('btn-stop');
        } else {
            nextNoteTime = audioCtx.currentTime + 0.05;
            currentBeat = 0; scheduler(); isPlaying = true;
            document.getElementById('startBtn').textContent = "STOP";
            document.getElementById('startBtn').classList.add('btn-stop');
        }
    });

    function adjustBPM(val) {
        bpm = Math.max(10, Math.min(500, bpm + val));
        document.getElementById('bpmDisplay').textContent = bpm;
        document.getElementById('tpsDisplay').textContent = (bpm / 60).toFixed(2) + " TPS";
    }

    function toggleLibrary() {
        const lib = document.getElementById('libraryOverlay');
        lib.style.display = lib.style.display === 'flex' ? 'none' : 'flex';
        if (lib.style.display === 'flex') renderLibrary();
    }

    function toggleFlash() {
        visualFlash = !visualFlash;
        const btn = document.getElementById('flashToggle');
        btn.classList.toggle('active-toggle', visualFlash);
    }

    function toggleRamp() {
        rampActive = !rampActive;
        const btn = document.getElementById('rampToggle');
        btn.classList.toggle('active-toggle', rampActive);
    }

    updateTally();
</script>
</body>
</html>
